<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors Game</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <div id="buttons">
        <button id="start">START</button>
        <button id="rock" style="display: none;">ROCK</button>
        <button id="paper" style="display: none;">PAPER</button>
        <button id="scissors" style="display: none;">SCISSORS</button>
    </div>
    

    <div id="results">
        <h2 id="score">Human score: 0 | Computer score: 0</h2>
    </div>

    <script src="rock-paper-scissors.js"></script>
</body>
</html>
